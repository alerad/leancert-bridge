name: Build Bridge Binaries

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      runtime-revision:
        description: Exact Bridge commit to publish (defaults to the workflow commit)
        required: false
        type: string
      runtime-tag:
        description: Optional OCI alias (defaults to the Git ref name)
        required: false
        type: string

env:
  LEANCERT_RUNTIME_REPOSITORY: oci://ghcr.io/alerad/leancert-runtime

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            binary_name: lean_bridge
            asset_name: lean_bridge-linux-x86_64
          - os: macos-15
            platform: macos
            arch: x86_64
            binary_name: lean_bridge
            asset_name: lean_bridge-macos-x86_64
          - os: macos-latest
            platform: macos
            arch: arm64
            binary_name: lean_bridge
            asset_name: lean_bridge-macos-arm64
          - os: windows-latest
            platform: windows
            arch: x86_64
            binary_name: lean_bridge.exe
            asset_name: lean_bridge-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Elan (Unix)
        if: matrix.platform != 'windows'
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Elan (Windows)
        if: matrix.platform == 'windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip" -OutFile elan.zip
          Expand-Archive elan.zip -DestinationPath elan-extract
          .\elan-extract\elan-init.exe -y --default-toolchain none
          echo "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-bridge-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('lakefile.lean', 'lean-toolchain') }}
          restore-keys: |
            lake-bridge-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Build lean_bridge (Unix)
        if: matrix.platform != 'windows'
        run: |
          # Drop executables restored from cache so tests can never run
          # against a stale binary from an earlier commit.
          rm -f .lake/build/bin/lean_bridge .lake/build/bin/lean_bridge_profile_test
          lake update
          lake build lean_bridge lean_bridge_profile_test
          test -x .lake/build/bin/lean_bridge
          test -x .lake/build/bin/lean_bridge_profile_test

      - name: Build lean_bridge (Windows)
        if: matrix.platform == 'windows'
        run: |
          # pwsh only propagates the final command's exit code, so check every
          # native command explicitly; a crashed lake (e.g. segfault) must fail
          # this step instead of letting tests run against stale cached exes.
          Remove-Item ".lake\build\bin\lean_bridge.exe", ".lake\build\bin\lean_bridge_profile_test.exe" -ErrorAction SilentlyContinue
          lake update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lake build lean_bridge lean_bridge_profile_test
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=lake build failed::lake exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          foreach ($exe in "lean_bridge.exe", "lean_bridge_profile_test.exe") {
            if (-not (Test-Path ".lake\build\bin\$exe")) {
              Write-Output "::error title=missing executable::.lake\build\bin\$exe was not produced by lake build"
              exit 1
            }
          }
          $leanPrefix = (& lean --print-prefix).Trim()
          Get-ChildItem "$leanPrefix\bin\*.dll" | Copy-Item -Destination ".lake\build\bin"
        shell: pwsh

      - name: Run protocol contract tests (Unix)
        if: matrix.platform != 'windows'
        run: |
          LEAN_BRIDGE=.lake/build/bin/${{ matrix.binary_name }} \
          LEAN_BRIDGE_PROFILED=.lake/build/bin/lean_bridge_profile_test \
          lake env python3 -m unittest -v tests.test_protocol

      - name: Run protocol contract tests (Windows)
        if: matrix.platform == 'windows'
        run: |
          $env:LEAN_BRIDGE = ".lake\build\bin\${{ matrix.binary_name }}"
          $env:LEAN_BRIDGE_PROFILED = ".lake\build\bin\lean_bridge_profile_test.exe"
          $testLog = Join-Path $env:RUNNER_TEMP "bridge-protocol-tests.log"
          lake env python -m unittest -v tests.test_protocol 2>&1 |
            Tee-Object -FilePath $testLog
          $testStatus = $LASTEXITCODE
          if ($testStatus -ne 0) {
            $details = Get-Content -Raw $testLog
            $details = $details.Replace("%", "%25")
            $details = $details.Replace("`r", "%0D")
            $details = $details.Replace("`n", "%0A")
            Write-Output "::error title=Windows protocol contract failure::$details"
            exit $testStatus
          }
        shell: pwsh

      - name: Stage artifact (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p dist
          cp .lake/build/bin/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          chmod +x dist/${{ matrix.asset_name }}
          ls -la dist/

      - name: Stage artifact (Windows)
        if: matrix.platform == 'windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ".lake\build\bin\${{ matrix.binary_name }}" "dist\${{ matrix.asset_name }}"
          Get-ChildItem dist
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

      - name: Set up Python for Lean Runtime V1
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve exact runtime lock
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RUNTIME_REVISION: ${{ inputs.runtime-revision || github.sha }}
        run: |
          python -m pip install 'lean-runtime>=1.0.1,<2.0.0'
          mkdir -p runtime-cache
          python scripts/resolve_runtime_lock.py \
            --revision "$RUNTIME_REVISION" \
            --output "runtime-cache/environment.lock-${{ matrix.platform }}-${{ matrix.arch }}.json"

      - name: Build and publish platform runtime
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          lean-runtime --quiet build-and-push \
            "runtime-cache/environment.lock-${{ matrix.platform }}-${{ matrix.arch }}.json" \
            --push-to "$LEANCERT_RUNTIME_REPOSITORY" \
            --platform-only \
            > "runtime-cache/platform-${{ matrix.platform }}-${{ matrix.arch }}.json"

      - name: Upload runtime publication result
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cache-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime-cache/*
          retention-days: 7

  publish-runtime-index:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-cache-*
          path: runtime-cache
          merge-multiple: true
      - name: Publish complete multi-platform index
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_TAG: ${{ inputs.runtime-tag || github.ref_name }}
        run: |
          python -m pip install 'lean-runtime>=1.0.1,<2.0.0'
          LOCK_ID="$(python - <<'PY'
          import json
          from pathlib import Path

          locks = list(Path("runtime-cache").glob("environment.lock*.json"))
          if not locks:
              raise SystemExit("no runtime lock was downloaded")
          lock_ids = {json.loads(path.read_text())["lock_id"] for path in locks}
          if len(lock_ids) != 1:
              raise SystemExit(f"platform jobs resolved different locks: {sorted(lock_ids)}")
          print(lock_ids.pop())
          PY
          )"
          mapfile -t RESULTS < <(find runtime-cache -name 'platform-*.json' -print | sort)
          test "${#RESULTS[@]}" -eq 4
          lean-runtime --quiet publish-index \
            "$LOCK_ID" "${RESULTS[@]}" \
            --repository "$LEANCERT_RUNTIME_REPOSITORY" \
            --tag "$RUNTIME_TAG"

  release:
    needs: [build, publish-runtime-index]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
