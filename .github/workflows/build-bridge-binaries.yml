name: Build Bridge Binaries

env:
  LEAN_RUNTIME_REVISION: v2.0.9
  LEAN_RUNTIME_HOME: ${{ github.workspace }}/.lean-runtime-ci
  PROGRAM_LIBRARY: ghcr.io/alerad/leancert-bridge-programs
  LEANCERT_ENVIRONMENT_LIBRARY: ghcr.io/alerad/leancert-runtime

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bridge-revision:
        description: Exact Bridge commit to publish (defaults to the workflow commit)
        required: false
        type: string
      environment-tag:
        description: Optional environment-library alias (defaults to the Git ref name)
        required: false
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            binary_name: lean_bridge
            asset_name: lean_bridge-linux-x86_64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            binary_name: lean_bridge
            asset_name: lean_bridge-macos-x86_64
          - os: macos-15
            platform: macos
            arch: arm64
            binary_name: lean_bridge
            asset_name: lean_bridge-macos-arm64
          - os: windows-latest
            platform: windows
            arch: x86_64
            binary_name: lean_bridge.exe
            asset_name: lean_bridge-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    env:
      # Windows MAX_PATH is 260 characters. The managed-environment store
      # nests `environments/.staging-<pid>-<uuid>/workspace/.lake/packages/
      # mathlib/.lake/build/lib/lean/<module>.olean.server` under this home;
      # rooted at the workspace that reaches 272+ characters and every
      # leantar decompression fails with `os error 3`. A two-letter root on
      # the workspace drive keeps the worst case near 220.
      LEAN_RUNTIME_HOME: ${{ matrix.platform == 'windows' && 'D:\lr' || format('{0}/.lean-runtime-ci', github.workspace) }}

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bridge-revision || github.sha }}

      - name: Record exact Bridge revision
        shell: bash
        run: echo "BRIDGE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Elan (Unix)
        if: matrix.platform != 'windows'
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Elan (Windows)
        if: matrix.platform == 'windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip" -OutFile elan.zip
          Expand-Archive elan.zip -DestinationPath elan-extract
          .\elan-extract\elan-init.exe -y --default-toolchain none
          $elanBin = Join-Path $env:USERPROFILE ".elan\bin"
          $elanExe = Join-Path $elanBin "elan.exe"
          if (-not (Test-Path $elanExe)) {
            Write-Output "::error title=Elan installation failed::$elanExe was not created"
            exit 1
          }
          $elanBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LEAN_RUNTIME_ELAN=$elanExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Cache Lake packages
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          # Never restore native objects or oleans across Lean toolchains.
          path: .lake
          key: lake-bridge-v3-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json', 'BridgeMain.lean', 'LeanBridge/**/*.lean', 'BridgeBuild/**/*.lean') }}
          restore-keys: |
            lake-bridge-v3-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('lean-toolchain') }}-

      - name: Build lean_bridge (Unix)
        if: matrix.platform != 'windows'
        run: |
          # Drop executables restored from cache so tests can never run
          # against a stale binary from an earlier commit.
          rm -f .lake/build/bin/lean_bridge .lake/build/bin/lean_bridge_profile_test
          lake update
          lake build lean_bridge lean_bridge_profile_test
          test -x .lake/build/bin/lean_bridge
          test -x .lake/build/bin/lean_bridge_profile_test

      - name: Build lean_bridge (Windows)
        if: matrix.platform == 'windows'
        run: |
          # pwsh only propagates the final command's exit code, so check every
          # native command explicitly; a crashed lake (e.g. segfault) must fail
          # this step instead of letting tests run against stale cached exes.
          Remove-Item ".lake\build\bin\lean_bridge.exe", ".lake\build\bin\lean_bridge_profile_test.exe" -ErrorAction SilentlyContinue
          lake update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lake build lean_bridge lean_bridge_profile_test
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=lake build failed::lake exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          foreach ($exe in "lean_bridge.exe", "lean_bridge_profile_test.exe") {
            if (-not (Test-Path ".lake\build\bin\$exe")) {
              Write-Output "::error title=missing executable::.lake\build\bin\$exe was not produced by lake build"
              exit 1
            }
          }
          $leanPrefix = (& lean --print-prefix).Trim()
          Get-ChildItem "$leanPrefix\bin\*.dll" | Copy-Item -Destination ".lake\build\bin"
        shell: pwsh

      - name: Run protocol contract tests (Unix)
        if: matrix.platform != 'windows'
        run: |
          LEAN_BRIDGE=.lake/build/bin/${{ matrix.binary_name }} \
          LEAN_BRIDGE_PROFILED=.lake/build/bin/lean_bridge_profile_test \
          lake env python3 -m unittest -v tests.test_protocol

      - name: Run protocol contract tests (Windows)
        if: matrix.platform == 'windows'
        run: |
          $env:LEAN_BRIDGE = ".lake\build\bin\${{ matrix.binary_name }}"
          $env:LEAN_BRIDGE_PROFILED = ".lake\build\bin\lean_bridge_profile_test.exe"
          $testLog = Join-Path $env:RUNNER_TEMP "bridge-protocol-tests.log"
          lake env python -m unittest -v tests.test_protocol 2>&1 |
            Tee-Object -FilePath $testLog
          $testStatus = $LASTEXITCODE
          if ($testStatus -ne 0) {
            $details = Get-Content -Raw $testLog
            $details = $details.Replace("%", "%25")
            $details = $details.Replace("`r", "%0D")
            $details = $details.Replace("`n", "%0A")
            Write-Output "::error title=Windows protocol contract failure::$details"
            exit $testStatus
          }
        shell: pwsh

      - name: Install ready-program publisher
        shell: bash
        run: >-
          python -m pip install
          "git+https://github.com/alerad/lean-runtime.git@${LEAN_RUNTIME_REVISION}"

      - name: Derive checked stack provenance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_stack_profile.py \
            --binary ".lake/build/bin/${{ matrix.binary_name }}" \
            --bridge-revision "$BRIDGE_REVISION" \
            --output stack-profile.json

      - name: Stage the ready-to-run Bridge program
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_program.py ".lake/build/bin/${{ matrix.binary_name }}" program-payload
          command_path="bin/lean_bridge"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            command_path="bin/lean_bridge.exe"
          fi
          python -m lean_runtime --home program-store program-create program-payload \
            --command "$command_path" \
            --source-revision "$BRIDGE_REVISION" \
            --toolchain "$(tr -d '\r\n' < lean-toolchain)" \
            --capability-id "$(python -c 'import json; print(json.load(open("stack-profile.json"))["leancert.capability.digest"])')" \
            --provenance-file stack-profile.json \
            > program-created.json
          program_id="$(python -c 'import json; print(json.load(open("program-created.json"))["program_id"])')"
          python -m lean_runtime --home program-store program-save-copy "$program_id" \
            --output "dist/leancert-bridge-program-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          python scripts/smoke_program.py \
            "dist/leancert-bridge-program-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"

      - name: Publish computer-specific ready program
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          program_id="$(python -c 'import json; print(json.load(open("program-created.json"))["program_id"])')"
          python -m lean_runtime --home program-store program-publish "$program_id" \
            --library "$PROGRAM_LIBRARY" > program-computer.json

      - name: Stage artifact (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p dist
          cp .lake/build/bin/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          chmod +x dist/${{ matrix.asset_name }}
          ls -la dist/

      - name: Stage artifact (Windows)
        if: matrix.platform == 'windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ".lake\build\bin\${{ matrix.binary_name }}" "dist\${{ matrix.asset_name }}"
          Get-ChildItem dist
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*
            program-computer.json
            stack-profile.json
          retention-days: 7

      - name: Save refreshed Lake artifacts
        if: steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-bridge-v3-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json', 'BridgeMain.lean', 'LeanBridge/**/*.lean', 'BridgeBuild/**/*.lean') }}

      - name: Release ordinary-build disk space
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lean_runtime._paths import remove_tree

          for name in (".lake", "program-store", "program-payload", "dist"):
              path = Path(name)
              if path.exists():
                  remove_tree(path)
          PY
          df -h . || true

      - name: Cache exact managed environment
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LEAN_RUNTIME_HOME }}
            environment-publication/environment.lock-${{ matrix.platform }}-${{ matrix.arch }}.json
          key: lean-runtime-environment-v2-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.bridge-revision || github.sha }}

      - name: Resolve exact environment description
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          BRIDGE_REVISION: ${{ inputs.bridge-revision || github.sha }}
        run: |
          mkdir -p environment-publication
          lock="environment-publication/environment.lock-${{ matrix.platform }}-${{ matrix.arch }}.json"
          if [[ ! -f "$lock" ]]; then
            python scripts/prepare_environment.py \
              --revision "$BRIDGE_REVISION" \
              --output "$lock"
          fi

      - name: Install Cosign for environment attestation
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build and publish computer-specific environment
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          lean-runtime --quiet --verbose build-and-publish \
            "environment-publication/environment.lock-${{ matrix.platform }}-${{ matrix.arch }}.json" \
            --publish-to "$LEANCERT_ENVIRONMENT_LIBRARY" \
            --timeout 3600 \
            --platform-only \
            --attest \
            > "environment-publication/computer-${{ matrix.platform }}-${{ matrix.arch }}.json"

      - name: Upload environment publication result
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ matrix.platform }}-${{ matrix.arch }}
          path: environment-publication/*
          retention-days: 7

  finalize-program-publication:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          path: platforms
      - name: Install ready-program publisher
        run: >-
          python -m pip install
          "git+https://github.com/alerad/lean-runtime.git@${LEAN_RUNTIME_REVISION}"
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Finalize multi-computer program publication
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t results < <(find platforms -name program-computer.json -type f | sort)
          test "${#results[@]}" -eq 4
          mapfile -t profiles < <(find platforms -name stack-profile.json -type f | sort)
          test "${#profiles[@]}" -eq 4
          python - "${profiles[@]}" <<'PY'
          import json
          import sys
          from pathlib import Path

          paths = [Path(value) for value in sys.argv[1:]]
          profiles = [json.loads(path.read_text(encoding="utf-8-sig")) for path in paths]
          if any(profile != profiles[0] for profile in profiles[1:]):
              raise SystemExit("platform stack profiles disagree")
          Path("stack-profile.json").write_text(
              json.dumps(profiles[0], indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          source_revision="$(python - <<'PY'
          import json
          from pathlib import Path

          revisions = {
              json.loads(path.read_text())["source_revision"]
              for path in Path("platforms").rglob("program-computer.json")
          }
          if len(revisions) != 1:
              raise SystemExit(f"platform program revisions disagree: {sorted(revisions)}")
          print(revisions.pop())
          PY
          )"
          tags=(--tag "revision-${source_revision}")
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=(--tag "${GITHUB_REF_NAME}")
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag latest)
          fi
          python -m lean_runtime program-finalize-publication "$source_revision" "${results[@]}" \
            --library "$PROGRAM_LIBRARY" "${tags[@]}" --sign > program-publication.json
          cat program-publication.json

      - name: Upload immutable program promotion record
        uses: actions/upload-artifact@v4
        with:
          name: bridge-program-publication
          path: |
            program-publication.json
            stack-profile.json
          retention-days: 30

  finalize-environment-publication:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: environment-*
          path: environment-publication
          merge-multiple: true
      - name: Install Lean Runtime
        run: >-
          python -m pip install
          "git+https://github.com/alerad/lean-runtime.git@${LEAN_RUNTIME_REVISION}"
      - name: Finalize multi-computer environment publication
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT_TAG: ${{ inputs.environment-tag || github.ref_name }}
        run: |
          LOCK_ID="$(python - <<'PY'
          import json
          from pathlib import Path

          locks = list(Path("environment-publication").glob("environment.lock*.json"))
          if not locks:
              raise SystemExit("no environment description was downloaded")
          lock_ids = {json.loads(path.read_text())["lock_id"] for path in locks}
          if len(lock_ids) != 1:
              raise SystemExit(f"computer jobs prepared different environments: {sorted(lock_ids)}")
          print(lock_ids.pop())
          PY
          )"
          mapfile -t RESULTS < <(find environment-publication -name 'computer-*.json' -print | sort)
          test "${#RESULTS[@]}" -eq 4
          lean-runtime --quiet finalize-publication \
            "$LOCK_ID" "${RESULTS[@]}" \
            --library "$LEANCERT_ENVIRONMENT_LIBRARY" \
            --tag "$ENVIRONMENT_TAG"

  release:
    needs: [build, finalize-program-publication, finalize-environment-publication]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
