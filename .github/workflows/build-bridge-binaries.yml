name: Build Bridge Binaries

env:
  LEAN_RUNTIME_REVISION: 198f37308133a722f965c2543b69dcf1b3fb164f
  PROGRAM_LIBRARY: ghcr.io/alerad/leancert-bridge-programs
  LEANCERT_ENVIRONMENT_LIBRARY: ghcr.io/alerad/leancert-runtime

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bridge-revision:
        description: Exact Bridge commit to publish (defaults to the workflow commit)
        required: false
        type: string
      environment-tag:
        description: Optional environment-library alias (defaults to the Git ref name)
        required: false
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            binary_name: lean_bridge
            asset_name: lean_bridge-linux-x86_64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            binary_name: lean_bridge
            asset_name: lean_bridge-macos-x86_64
          - os: macos-15
            platform: macos
            arch: arm64
            binary_name: lean_bridge
            asset_name: lean_bridge-macos-arm64
          - os: windows-latest
            platform: windows
            arch: x86_64
            binary_name: lean_bridge.exe
            asset_name: lean_bridge-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Elan (Unix)
        if: matrix.platform != 'windows'
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Elan (Windows)
        if: matrix.platform == 'windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip" -OutFile elan.zip
          Expand-Archive elan.zip -DestinationPath elan-extract
          .\elan-extract\elan-init.exe -y --default-toolchain none
          echo "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-bridge-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('lakefile.lean', 'lean-toolchain') }}
          restore-keys: |
            lake-bridge-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Build lean_bridge (Unix)
        if: matrix.platform != 'windows'
        run: |
          # Drop executables restored from cache so tests can never run
          # against a stale binary from an earlier commit.
          rm -f .lake/build/bin/lean_bridge .lake/build/bin/lean_bridge_profile_test
          lake update
          lake build lean_bridge lean_bridge_profile_test
          test -x .lake/build/bin/lean_bridge
          test -x .lake/build/bin/lean_bridge_profile_test

      - name: Build lean_bridge (Windows)
        if: matrix.platform == 'windows'
        run: |
          # pwsh only propagates the final command's exit code, so check every
          # native command explicitly; a crashed lake (e.g. segfault) must fail
          # this step instead of letting tests run against stale cached exes.
          Remove-Item ".lake\build\bin\lean_bridge.exe", ".lake\build\bin\lean_bridge_profile_test.exe" -ErrorAction SilentlyContinue
          lake update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lake build lean_bridge lean_bridge_profile_test
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=lake build failed::lake exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          foreach ($exe in "lean_bridge.exe", "lean_bridge_profile_test.exe") {
            if (-not (Test-Path ".lake\build\bin\$exe")) {
              Write-Output "::error title=missing executable::.lake\build\bin\$exe was not produced by lake build"
              exit 1
            }
          }
          $leanPrefix = (& lean --print-prefix).Trim()
          Get-ChildItem "$leanPrefix\bin\*.dll" | Copy-Item -Destination ".lake\build\bin"
        shell: pwsh

      - name: Run protocol contract tests (Unix)
        if: matrix.platform != 'windows'
        run: |
          LEAN_BRIDGE=.lake/build/bin/${{ matrix.binary_name }} \
          LEAN_BRIDGE_PROFILED=.lake/build/bin/lean_bridge_profile_test \
          lake env python3 -m unittest -v tests.test_protocol

      - name: Run protocol contract tests (Windows)
        if: matrix.platform == 'windows'
        run: |
          $env:LEAN_BRIDGE = ".lake\build\bin\${{ matrix.binary_name }}"
          $env:LEAN_BRIDGE_PROFILED = ".lake\build\bin\lean_bridge_profile_test.exe"
          $testLog = Join-Path $env:RUNNER_TEMP "bridge-protocol-tests.log"
          lake env python -m unittest -v tests.test_protocol 2>&1 |
            Tee-Object -FilePath $testLog
          $testStatus = $LASTEXITCODE
          if ($testStatus -ne 0) {
            $details = Get-Content -Raw $testLog
            $details = $details.Replace("%", "%25")
            $details = $details.Replace("`r", "%0D")
            $details = $details.Replace("`n", "%0A")
            Write-Output "::error title=Windows protocol contract failure::$details"
            exit $testStatus
          }
        shell: pwsh

      - name: Install ready-program publisher
        shell: bash
        run: >-
          python -m pip install
          "git+https://github.com/alerad/lean-runtime.git@${LEAN_RUNTIME_REVISION}"

      - name: Stage the ready-to-run Bridge program
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_program.py ".lake/build/bin/${{ matrix.binary_name }}" program-payload
          command_path="bin/lean_bridge"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            command_path="bin/lean_bridge.exe"
          fi
          python -m lean_runtime --home program-store program-create program-payload \
            --command "$command_path" \
            --source-revision "$GITHUB_SHA" \
            --toolchain "$(tr -d '\r\n' < lean-toolchain)" \
            > program-created.json
          program_id="$(python -c 'import json; print(json.load(open("program-created.json"))["program_id"])')"
          python -m lean_runtime --home program-store program-save-copy "$program_id" \
            --output "dist/leancert-bridge-program-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          python scripts/smoke_program.py \
            "dist/leancert-bridge-program-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"

      - name: Publish computer-specific ready program
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          program_id="$(python -c 'import json; print(json.load(open("program-created.json"))["program_id"])')"
          python -m lean_runtime --home program-store program-publish "$program_id" \
            --library "$PROGRAM_LIBRARY" > program-computer.json

      - name: Stage artifact (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p dist
          cp .lake/build/bin/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          chmod +x dist/${{ matrix.asset_name }}
          ls -la dist/

      - name: Stage artifact (Windows)
        if: matrix.platform == 'windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ".lake\build\bin\${{ matrix.binary_name }}" "dist\${{ matrix.asset_name }}"
          Get-ChildItem dist
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*
            program-computer.json
          retention-days: 7

      - name: Resolve exact environment description
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          BRIDGE_REVISION: ${{ inputs.bridge-revision || github.sha }}
        run: |
          mkdir -p environment-publication
          python scripts/prepare_environment.py \
            --revision "$BRIDGE_REVISION" \
            --output "environment-publication/environment.lock-${{ matrix.platform }}-${{ matrix.arch }}.json"

      - name: Install Cosign for environment attestation
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build and publish computer-specific environment
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          lean-runtime --quiet build-and-publish \
            "environment-publication/environment.lock-${{ matrix.platform }}-${{ matrix.arch }}.json" \
            --publish-to "$LEANCERT_ENVIRONMENT_LIBRARY" \
            --platform-only \
            --attest \
            > "environment-publication/computer-${{ matrix.platform }}-${{ matrix.arch }}.json"

      - name: Upload environment publication result
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ matrix.platform }}-${{ matrix.arch }}
          path: environment-publication/*
          retention-days: 7

  finalize-program-publication:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          path: platforms
      - name: Install ready-program publisher
        run: >-
          python -m pip install
          "git+https://github.com/alerad/lean-runtime.git@${LEAN_RUNTIME_REVISION}"
      - uses: sigstore/cosign-installer@v3.8.2
      - name: Finalize multi-computer program publication
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t results < <(find platforms -name program-computer.json -type f | sort)
          test "${#results[@]}" -eq 4
          tags=(--tag "revision-${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=(--tag "${GITHUB_REF_NAME}")
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag latest)
          fi
          python -m lean_runtime program-finalize-publication "$GITHUB_SHA" "${results[@]}" \
            --library "$PROGRAM_LIBRARY" "${tags[@]}" --sign

  finalize-environment-publication:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: environment-*
          path: environment-publication
          merge-multiple: true
      - name: Install Lean Runtime
        run: >-
          python -m pip install
          "git+https://github.com/alerad/lean-runtime.git@${LEAN_RUNTIME_REVISION}"
      - name: Finalize multi-computer environment publication
        shell: bash
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT_TAG: ${{ inputs.environment-tag || github.ref_name }}
        run: |
          LOCK_ID="$(python - <<'PY'
          import json
          from pathlib import Path

          locks = list(Path("environment-publication").glob("environment.lock*.json"))
          if not locks:
              raise SystemExit("no environment description was downloaded")
          lock_ids = {json.loads(path.read_text())["lock_id"] for path in locks}
          if len(lock_ids) != 1:
              raise SystemExit(f"computer jobs prepared different environments: {sorted(lock_ids)}")
          print(lock_ids.pop())
          PY
          )"
          mapfile -t RESULTS < <(find environment-publication -name 'computer-*.json' -print | sort)
          test "${#RESULTS[@]}" -eq 4
          lean-runtime --quiet finalize-publication \
            "$LOCK_ID" "${RESULTS[@]}" \
            --library "$LEANCERT_ENVIRONMENT_LIBRARY" \
            --tag "$ENVIRONMENT_TAG"

  release:
    needs: [build, finalize-program-publication, finalize-environment-publication]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
